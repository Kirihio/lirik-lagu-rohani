<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1565c0">

    <meta name="description"
          content="Koleksi Lirik Lagu Rohani karya Selsires Kirihio">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Koleksi Lirik Lagu">


    <title>Koleksi Lirik Lagu</title>


    <!-- ==================================================
         PWA MANIFEST
         ================================================== -->

    <link rel="manifest"
          href="./manifest.json">


    <!-- ==================================================
         CSS
         ================================================== -->

    <link rel="stylesheet"
          href="./css/style.css">


</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

    <h1>🎵 Koleksi Lirik Lagu</h1>


    <!-- =================================================
         TOMBOL INSTALL PWA
         ================================================= -->

    <button
        id="btnInstall"
        type="button"
        hidden>

        📲 Install Aplikasi

    </button>


</header>



<!-- =====================================================
     MAIN
     ===================================================== -->

<main>


    <!-- =================================================
         SIDEBAR
         ================================================= -->

    <aside id="sidebar">


        <!-- =================================================
             PENCARIAN
             ================================================= -->

        <input
            type="text"
            id="cari"
            placeholder="🔍 Cari lagu..."
            autocomplete="off">


        <!-- =================================================
             DAFTAR LAGU
             ================================================= -->

        <div id="daftarLagu">

            Memuat daftar lagu...

        </div>


    </aside>



    <!-- =================================================
         CONTENT
         ================================================= -->

    <section id="content">


        <h2>Selamat Datang</h2>


        <p>
            Koleksi Lirik Lagu Rohani
        </p>


        <div id="lirik"></div>


    </section>


</main>



<!-- =====================================================
     JAVASCRIPT UTAMA
     ===================================================== -->

<script src="./js/app.js"></script>



<!-- =====================================================
     PWA INSTALL + SERVICE WORKER
     ===================================================== -->

<script>


/* ======================================================
   KONFIGURASI PWA
   ====================================================== */

let deferredPrompt = null;


const btnInstall =
    document.getElementById("btnInstall");



/* ======================================================
   LOG PEMBUKAAN
   ====================================================== */

console.log(
    "===================================="
);

console.log(
    "KOLEKSI LIRIK LAGU - PWA"
);

console.log(
    "PWA INSTALL SCRIPT AKTIF"
);

console.log(
    "===================================="
);



/* ======================================================
   CEK APAKAH SUDAH BERJALAN SEBAGAI PWA
   ====================================================== */

function isPWAInstalled() {

    return (

        window.matchMedia(
            "(display-mode: standalone)"
        ).matches

        ||

        window.navigator.standalone === true

    );

}


console.log(
    "PWA sudah terinstall:",
    isPWAInstalled()
);



/* ======================================================
   JIKA SUDAH MENJADI PWA
   SEMBUNYIKAN TOMBOL INSTALL
   ====================================================== */

if (isPWAInstalled()) {

    if (btnInstall) {

        btnInstall.hidden = true;

    }

}



/* ======================================================
   EVENT BEFOREINSTALLPROMPT
   ====================================================== */

window.addEventListener(
    "beforeinstallprompt",
    function(event) {


        console.log(
            "===================================="
        );


        console.log(
            "BEFOREINSTALLPROMPT TERDETEKSI"
        );


        console.log(
            "PWA siap untuk di-install."
        );


        console.log(
            "===================================="
        );


        /*
         * Mencegah Chrome langsung
         * menampilkan dialog instalasi.
         */

        event.preventDefault();


        /*
         * Simpan event.
         */

        deferredPrompt = event;


        /*
         * Tampilkan tombol Install.
         */

        if (
            btnInstall
            &&
            !isPWAInstalled()
        ) {

            btnInstall.hidden = false;

        }


    }
);



/* ======================================================
   TOMBOL INSTALL DIKLIK
   ====================================================== */

if (btnInstall) {


    btnInstall.addEventListener(
        "click",
        async function() {


            console.log(
                "===================================="
            );


            console.log(
                "TOMBOL INSTALL DIKLIK"
            );


            console.log(
                "deferredPrompt:",
                deferredPrompt
            );


            console.log(
                "===================================="
            );


            /*
             * Jika Chrome belum memberikan
             * beforeinstallprompt.
             */

            if (!deferredPrompt) {


                alert(
                    "Aplikasi belum siap untuk di-install.\n\n" +
                    "Pastikan halaman dibuka melalui HTTPS " +
                    "dan tunggu beberapa detik."
                );


                return;

            }


            console.log(
                "Menampilkan dialog Install PWA..."
            );


            /*
             * Tampilkan dialog instalasi.
             */

            deferredPrompt.prompt();


            /*
             * Tunggu pilihan pengguna.
             */

            const result =
                await deferredPrompt.userChoice;


            console.log(
                "Hasil instalasi:",
                result.outcome
            );


            /*
             * Event hanya dapat digunakan sekali.
             */

            deferredPrompt = null;


            /*
             * Sembunyikan tombol setelah
             * prompt digunakan.
             */

            btnInstall.hidden = true;


        }
    );

}



/* ======================================================
   EVENT APPINSTALLED
   ====================================================== */

window.addEventListener(
    "appinstalled",
    function() {


        console.log(
            "===================================="
        );


        console.log(
            "KOLEKSI LIRIK LAGU BERHASIL DI-INSTALL"
        );


        console.log(
            "===================================="
        );


        deferredPrompt = null;


        if (btnInstall) {

            btnInstall.hidden = true;

        }


    }
);



/* ======================================================
   SERVICE WORKER
   ====================================================== */

if ("serviceWorker" in navigator) {


    window.addEventListener(
        "load",
        async function() {


            console.log(
                "Mendaftarkan Service Worker..."
            );


            try {


                const registration =
                    await navigator.serviceWorker.register(
                        "./sw.js",
                        {
                            scope: "./"
                        }
                    );


                console.log(
                    "Service Worker berhasil terdaftar."
                );


                console.log(
                    "Scope:",
                    registration.scope
                );


            }

            catch (error) {


                console.error(
                    "Service Worker gagal."
                );


                console.error(
                    error
                );


            }


        }
    );


}
else {


    console.warn(
        "Browser tidak mendukung Service Worker."
    );


}


</script>



</body>

</html>
