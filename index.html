<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1565c0">

    <title>Koleksi Lirik Lagu</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <h1>🎵 Koleksi Lirik Lagu</h1>

    <button id="btnInstall" hidden>
        📲 Install Aplikasi
    </button>

</header>

<main>

    <aside id="sidebar">

        <input
            type="text"
            id="cari"
            placeholder="🔍 Cari lagu...">

        <div id="daftarLagu">
            Memuat daftar lagu...
        </div>

    </aside>

    <section id="content">

        <h2>Selamat Datang</h2>

        <p>
            Frontend GitHub Pages berhasil dibuat.
        </p>

        <div id="lirik"></div>

    </section>

</main>

<script src="js/app.js"></script>

<script>

/******************************************************
 * Service Worker
 ******************************************************/

if ("serviceWorker" in navigator) {

    window.addEventListener("load", async () => {

        try {

            const reg = await navigator.serviceWorker.register("./sw.js");

            console.log("Service Worker berhasil.");

            console.log(reg);

        }

        catch (err) {

            console.error("Service Worker gagal.");

            console.error(err);

        }

    });

}


/******************************************************
 * Install PWA
 ******************************************************/

let deferredPrompt = null;

const btnInstall =
    document.getElementById("btnInstall");


window.addEventListener("beforeinstallprompt", (e) => {

    console.log("beforeinstallprompt");

    e.preventDefault();

    deferredPrompt = e;

    btnInstall.hidden = false;

});


btnInstall.addEventListener("click", async () => {

    if (!deferredPrompt) {

        alert("Aplikasi belum siap untuk diinstall.");

        return;

    }

    deferredPrompt.prompt();

    const result =
        await deferredPrompt.userChoice;

    console.log(result);

    deferredPrompt = null;

    btnInstall.hidden = true;

});


window.addEventListener("appinstalled", () => {

    console.log("Aplikasi berhasil diinstall.");

    btnInstall.hidden = true;

});

</script>

</body>

</html>
